<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Javascript Array Methods</h2>
    <h3>join() & pop()</h3>
    
    <p id="myjoin"></p>
    <p id="myfirstpop"></p>
    <p id="mysecondpop"></p>
    
    <script>
        var names = [
            "Sarah",
            "Myra",
            "Avni",
            "Shannon",
            "Aanya"
        ];

        document.getElementById("myjoin").innerHTML = names.join(" * ");
        document.getElementById("myfirstpop").innerHTML = names; names.pop();
        document.getElementById("mysecondpop").innerHTML =names;



    </script>
</body>
</html>
